name: Console typecheck

on:
  pull_request:
    paths:
      - "console/**"
      - ".github/workflows/console-typecheck.yml"
  push:
    branches: [main]
    paths:
      - "console/**"
      - ".github/workflows/console-typecheck.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:usage
      - run: npm run test:pricing
