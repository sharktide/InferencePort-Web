<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>InferencePort AI | Cloud & Local AI Models</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="styles/shared.css" />
		<script src="components/ip-navbar.js"></script>
		<script src="components/ip-footer.js"></script>
		<script src="scripts/animations.js"></script>
		<style>
			/* ── Hero ── */
			.hero-section {
				padding: 100px 0 80px;
				text-align: center;
				background: linear-gradient(180deg, rgba(79, 124, 255, 0.04) 0%, transparent 100%);
				position: relative;
				overflow: hidden;
			}
			.hero-section::before {
				content: "";
				position: absolute;
				top: -200px;
				left: 50%;
				transform: translateX(-50%);
				width: 800px;
				height: 600px;
				background: radial-gradient(ellipse, rgba(79, 124, 255, 0.08) 0%, transparent 70%);
				pointer-events: none;
			}
			.hero-eyebrow {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				font-family: "JetBrains Mono", monospace;
				font-size: 0.72rem;
				font-weight: 500;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--brand);
				background: var(--brand-dim);
				border: 1px solid var(--brand-border);
				border-radius: 50px;
				padding: 6px 16px;
				margin-bottom: 24px;
			}
			.pulse {
				width: 7px;
				height: 7px;
				background: var(--brand);
				border-radius: 50%;
				animation: pulse 2s ease infinite;
			}
			@keyframes pulse {
				0%, 100% { opacity: 1; transform: scale(1); }
				50% { opacity: 0.4; transform: scale(0.8); }
			}
			.hero-title {
				font-size: clamp(2.2rem, 5vw, 3.8rem);
				font-weight: 800;
				letter-spacing: -0.04em;
				line-height: 1.08;
				color: var(--text);
			}
			.hero-title .accent { color: var(--brand); }
			.hero-subtitle {
				font-size: 1.05rem;
				color: var(--text-muted);
				max-width: 480px;
				margin: 18px auto 0;
				line-height: 1.65;
			}
			.stat-num {
				font-size: 2rem;
				font-weight: 800;
				color: var(--text);
				letter-spacing: -0.04em;
			}
			.stat-label {
				font-size: 0.78rem;
				color: var(--text-muted);
				margin-top: 2px;
			}
			.stats-divider {
				border-top: 1px solid var(--border);
				margin-top: 3rem;
				padding-top: 2.5rem;
			}

			/* ── Model Rows ── */
			.model-row {
				display: flex;
				align-items: center;
				gap: 14px;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				padding: 14px 18px;
				transition: border-color 0.2s var(--ease), transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
			}
			.model-row:hover {
				border-color: var(--brand-border);
				transform: translateX(3px);
				box-shadow: var(--shadow-sm);
			}
			.model-row.featured {
				border-color: var(--brand-border);
				background: rgba(79, 124, 255, 0.03);
			}
			.model-icon {
				width: 40px;
				height: 40px;
				border-radius: 10px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 1.15rem;
				flex-shrink: 0;
			}
			.icon-blue   { background: var(--brand-dim); }
			.icon-cyan   { background: var(--cyan-dim); }
			.icon-purple { background: var(--purple-dim); }
			.icon-green  { background: var(--success-dim); }
			.model-name  { font-weight: 700; font-size: 0.9rem; color: var(--text); }
			.model-desc  { font-size: 0.78rem; color: var(--text-muted); margin-top: 1px; }

			/* ── Feature Cards ── */
			.feat-icon { font-size: 1.5rem; margin-bottom: 12px; }
			.feat-title { font-weight: 700; font-size: 0.97rem; color: var(--text); margin-bottom: 6px; }
			.feat-body  { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; }

			/* ── Compare Box ── */
			.compare-box {
				background: var(--bg-alt);
				border: 1px solid var(--border);
				border-radius: var(--radius-xl);
				overflow: hidden;
				position: relative;
			}
			.compare-box::before {
				content: "";
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				height: 3px;
				background: linear-gradient(90deg, var(--brand), var(--purple), var(--cyan));
			}
			.compare-list {
				list-style: none;
				padding: 0;
				margin: 0;
			}
			.compare-list li {
				display: flex;
				align-items: center;
				gap: 9px;
				padding: 10px 0;
				border-bottom: 1px solid var(--border-light);
				font-size: 0.86rem;
				color: var(--text-body);
			}
			.compare-list li:last-child { border-bottom: none; }
			.col-label {
				font-family: "JetBrains Mono", monospace;
				font-size: 0.7rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				margin-bottom: 14px;
				color: var(--text);
				font-weight: 600;
			}
			.col-dot {
				display: inline-block;
				width: 8px;
				height: 8px;
				border-radius: 50%;
				margin-right: 6px;
			}
			.dot-cloud { background: var(--brand); }
			.dot-local { background: var(--success); }

			/* ── Plan Cards ── */
			.plan-card {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: var(--radius-lg);
				padding: 26px 20px;
				display: flex;
				flex-direction: column;
				height: 100%;
				position: relative;
				transition: border-color 0.2s var(--ease), transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
			}
			.plan-card:hover {
				transform: translateY(-4px);
				border-color: var(--brand-border);
				box-shadow: var(--shadow-md);
			}
			.plan-card.popular {
				border-color: var(--brand);
				background: rgba(79, 124, 255, 0.03);
			}
			.popular-pill {
				position: absolute;
				top: -11px;
				left: 50%;
				transform: translateX(-50%);
				background: var(--brand);
				color: #fff;
				font-family: "JetBrains Mono", monospace;
				font-size: 0.6rem;
				font-weight: 500;
				padding: 3px 12px;
				border-radius: 50px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				white-space: nowrap;
			}
			.plan-name { font-weight: 800; font-size: 0.95rem; color: var(--text); }
			.plan-price {
				font-size: 2.1rem;
				font-weight: 800;
				color: var(--text);
				letter-spacing: -0.04em;
				line-height: 1;
				margin: 16px 0 2px;
			}
			.plan-price sup { font-size: 0.95rem; vertical-align: super; font-weight: 600; }
			.plan-period { font-size: 0.76rem; color: var(--text-muted); margin-bottom: 16px; }
			.plan-hr { border-color: var(--border-light); margin: 14px 0; }
			.plan-section {
				font-family: "JetBrains Mono", monospace;
				font-size: 0.62rem;
				color: var(--brand);
				letter-spacing: 0.1em;
				text-transform: uppercase;
				margin-bottom: 8px;
				font-weight: 500;
			}
			.plan-feature {
				font-size: 0.82rem;
				color: var(--text-muted);
				display: flex;
				align-items: center;
				gap: 7px;
				margin-bottom: 7px;
			}
			.plan-feature.hi { color: var(--text-body); font-weight: 500; }
			.btn-plan-primary {
				background: var(--brand);
				color: #fff;
				border: none;
				border-radius: 8px;
				padding: 10px;
				font-weight: 600;
				font-size: 0.85rem;
				width: 100%;
				margin-top: auto;
				transition: background 0.15s var(--ease), transform 0.15s var(--ease);
			}
			.btn-plan-primary:hover { background: var(--brand-hover); color: #fff; transform: translateY(-1px); }
			.btn-plan-outline {
				background: var(--bg);
				color: var(--text-body);
				border: 1px solid var(--border);
				border-radius: 8px;
				padding: 10px;
				font-size: 0.85rem;
				width: 100%;
				margin-top: auto;
				transition: background 0.15s var(--ease), border-color 0.15s var(--ease), transform 0.15s var(--ease);
			}
			.btn-plan-outline:hover { background: var(--bg-alt); border-color: #d1d5db; color: var(--text); transform: translateY(-1px); }

			/* ── Solution Cards ── */
			.sol-kicker {
				font-family: "JetBrains Mono", monospace;
				font-size: 0.66rem;
				color: var(--gold);
				letter-spacing: 0.1em;
				text-transform: uppercase;
				margin-bottom: 8px;
			}
			.sol-title {
				font-size: 1.05rem;
				font-weight: 700;
				color: var(--text);
				margin-bottom: 8px;
			}
			.sol-body {
				font-size: 0.85rem;
				color: var(--text-muted);
				line-height: 1.6;
			}
			.sol-list {
				list-style: none;
				padding: 0;
				margin: 14px 0 0;
			}
			.sol-list li {
				font-size: 0.82rem;
				color: var(--text-body);
				margin-bottom: 6px;
			}
			.sol-list li::before {
				content: "→ ";
				color: var(--gold);
				margin-right: 4px;
			}
			.sol-gen  { border-left: 3px solid var(--brand) !important; }
			.sol-p2g  { border-left: 3px solid var(--success) !important; }
			.sol-registry { border-left: 3px solid var(--gold) !important; }
			.sol-chat { border-left: 3px solid var(--cyan) !important; }
			.sol-server { border-left: 3px solid var(--purple) !important; }
			.sol-shield { border-left: 3px solid var(--danger) !important; }

			/* ── Step Numbers ── */
			.step-num {
				font-family: "JetBrains Mono", monospace;
				font-size: 1.6rem;
				font-weight: 800;
				color: var(--brand);
				background: var(--brand-dim);
				border: 1px solid var(--brand-border);
				width: 48px;
				height: 48px;
				border-radius: 12px;
				display: flex;
				align-items: center;
				justify-content: center;
				margin-bottom: 14px;
			}

			/* ── API Compare Table ── */
			.compare-table {
				width: 100%;
				border-collapse: collapse;
			}
			.compare-table th,
			.compare-table td {
				padding: 14px 16px;
				border-bottom: 1px solid var(--border-light);
				vertical-align: top;
			}
			.compare-table th {
				font-family: "JetBrains Mono", monospace;
				font-size: 0.68rem;
				color: var(--text-muted);
				text-transform: uppercase;
				letter-spacing: 0.1em;
			}
			.compare-table td {
				font-size: 0.86rem;
				color: var(--text-body);
			}
			.compare-table tr:last-child td { border-bottom: none; }
			.compare-table .best {
				color: var(--gold);
				font-weight: 700;
			}

			/* ── Lightning Section ── */
			.lr-section { position: relative; overflow: hidden; }
			.lr-section::before {
				content: "";
				position: absolute;
				inset: 0;
				background: linear-gradient(180deg, rgba(251,191,36,0.03) 0%, transparent 100%);
				pointer-events: none;
			}
			.lr-divider { height: 1px; background: var(--border); margin: 0; }
			.lr-eyebrow {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				font-family: "JetBrains Mono", monospace;
				font-size: 0.7rem;
				font-weight: 500;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: #92400e;
				background: var(--gold-dim);
				border: 1px solid var(--gold-border);
				border-radius: 50px;
				padding: 5px 14px;
				margin-bottom: 18px;
			}
			.lr-bolt { animation: lrPulseBolt 1.8s ease infinite; }
			@keyframes lrPulseBolt {
				0%, 100% { opacity: 1; }
				50% { opacity: 0.35; }
			}
			.lr-title {
				font-size: clamp(1.6rem, 3.5vw, 2.4rem);
				font-weight: 800;
				letter-spacing: -0.04em;
				line-height: 1.1;
				color: var(--text);
			}
			.lr-title .accent-gold { color: #b45309; }
			.lr-sub {
				font-size: 0.92rem;
				color: var(--text-muted);
				max-width: 490px;
				line-height: 1.65;
				margin-top: 14px;
			}

			/* Lightning Card */
			.lr-card {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: var(--radius-xl);
				overflow: hidden;
				position: relative;
				box-shadow: var(--shadow-sm);
			}
			.lr-card::before {
				content: "";
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				height: 3px;
				background: linear-gradient(90deg, var(--gold), #f59e0b, var(--brand), var(--cyan));
			}
			.lr-card-inner { padding: 26px 26px 22px; }
			.lr-card-label {
				font-family: "JetBrains Mono", monospace;
				font-size: 0.64rem;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: #92400e;
				margin-bottom: 13px;
				font-weight: 500;
			}
			.lr-prompt-input {
				width: 100%;
				background: var(--bg-alt);
				border: 1px solid var(--border);
				border-radius: 10px;
				color: var(--text);
				font-family: "Inter", sans-serif;
				font-size: 0.9rem;
				line-height: 1.6;
				padding: 13px 15px;
				resize: none;
				outline: none;
				transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
				box-sizing: border-box;
			}
			.lr-prompt-input::placeholder { color: var(--text-muted); }
			.lr-prompt-input:focus {
				border-color: var(--brand);
				box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.1);
			}
			.lr-analyze-btn {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				background: var(--gold-dim);
				color: #92400e;
				border: 1px solid var(--gold-border);
				border-radius: 8px;
				padding: 7px 16px;
				font-size: 0.85rem;
				font-weight: 600;
				cursor: pointer;
				transition: background 0.15s var(--ease), transform 0.15s var(--ease);
				font-family: "Inter", sans-serif;
				white-space: nowrap;
			}
			.lr-analyze-btn:hover:not(:disabled) {
				background: rgba(251,191,36,0.18);
				transform: translateY(-1px);
			}
			.lr-analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }

			/* Toolbar */
			.lr-toolbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 10px;
				margin-top: 10px;
				flex-wrap: wrap;
			}
			.lr-toolbar-toggles {
				display: flex;
				align-items: center;
				gap: 6px;
				flex-wrap: wrap;
			}
			.lr-toolbar-actions {
				display: flex;
				align-items: center;
				gap: 8px;
				flex-shrink: 0;
			}
			.lr-toggle {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				background: var(--bg);
				border: 1px solid var(--border);
				border-radius: 7px;
				padding: 6px 11px;
				font-size: 0.78rem;
				font-weight: 500;
				color: var(--text-muted);
				cursor: pointer;
				font-family: "Inter", sans-serif;
				transition: background 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
				user-select: none;
			}
			.lr-toggle svg { width: 13px; height: 13px; flex-shrink: 0; }
			.lr-toggle:hover { background: var(--bg-alt); color: var(--text-body); border-color: #d1d5db; }
			.lr-toggle.active {
				background: var(--brand-dim);
				border-color: var(--brand-border);
				color: var(--brand);
			}
			#tog-search.active  { background: var(--cyan-dim);    border-color: var(--cyan-border);    color: #0891b2; }
			#tog-img.active     { background: var(--purple-dim);  border-color: var(--purple-border);  color: var(--purple); }
			#tog-vid.active     { background: var(--danger-dim);  border-color: var(--danger-border);  color: var(--danger); }
			#tog-audio.active   { background: var(--success-dim); border-color: var(--success-border); color: var(--success); }

			/* Upload */
			.lr-upload-btn {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				background: var(--bg);
				border: 1px solid var(--border);
				border-radius: 7px;
				padding: 6px 11px;
				font-size: 0.78rem;
				font-weight: 500;
				color: var(--text-muted);
				cursor: pointer;
				font-family: "Inter", sans-serif;
				transition: background 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
				user-select: none;
				white-space: nowrap;
			}
			.lr-upload-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
			.lr-upload-btn:hover { background: var(--bg-alt); color: var(--text-body); border-color: #d1d5db; }
			.lr-upload-btn.has-file {
				background: var(--gold-dim);
				border-color: var(--gold-border);
				color: #92400e;
			}

			/* Image preview */
			.lr-img-preview {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				background: var(--gold-dim);
				border: 1px solid var(--gold-border);
				border-radius: 6px;
				padding: 5px 10px;
				font-size: 0.76rem;
				color: #92400e;
				margin-top: 8px;
				max-width: 100%;
			}
			.lr-img-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
			.lr-img-remove {
				background: none;
				border: none;
				padding: 0;
				margin: 0;
				color: #92400e;
				cursor: pointer;
				display: flex;
				align-items: center;
				opacity: 0.6;
				transition: opacity 0.15s;
				flex-shrink: 0;
			}
			.lr-img-remove:hover { opacity: 1; }
			.lr-img-remove svg { width: 10px; height: 10px; }
			.lr-btn-spinner {
				width: 12px;
				height: 12px;
				border: 2px solid rgba(251,191,36,0.3);
				border-top-color: #92400e;
				border-radius: 50%;
				animation: lrSpin 0.65s linear infinite;
				display: none;
			}
			@keyframes lrSpin { to { transform: rotate(360deg); } }
			.lr-result {
				margin-top: 16px;
				display: none;
				animation: lrFadeUp 0.3s ease both;
			}
			@keyframes lrFadeUp {
				from { opacity: 0; transform: translateY(7px); }
				to   { opacity: 1; transform: translateY(0); }
			}
			.lr-result-row {
				display: flex;
				align-items: center;
				gap: 12px;
				background: var(--gold-dim);
				border: 1px solid var(--gold-border);
				border-radius: 10px;
				padding: 13px 15px;
			}
			.lr-result-icon {
				font-size: 1.2rem;
				flex-shrink: 0;
				width: 36px;
				height: 36px;
				background: rgba(251,191,36,0.15);
				border-radius: 8px;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.lr-result-label {
				font-family: "JetBrains Mono", monospace;
				font-size: 0.6rem;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: var(--text-muted);
			}
			.lr-result-model { font-weight: 700; font-size: 0.95rem; color: #92400e; margin-top: 2px; }
			.lr-result-provider { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; }
			.lr-error { color: var(--danger); font-size: 0.8rem; margin-top: 9px; display: none; }

			/* ── Open Source Cards ── */
			.oss-card {
				display: flex;
				align-items: center;
				gap: 16px;
				text-decoration: none;
				color: inherit;
			}
			.oss-icon {
				font-size: 1.8rem;
				width: 52px;
				height: 52px;
				background: var(--bg-alt);
				border: 1px solid var(--border);
				border-radius: 12px;
				display: flex;
				align-items: center;
				justify-content: center;
				flex-shrink: 0;
				transition: border-color 0.2s var(--ease), transform 0.2s var(--ease);
			}
			.oss-card:hover .oss-icon {
				border-color: var(--brand-border);
				transform: translateY(-2px);
			}
			.oss-title { font-weight: 700; font-size: 0.97rem; color: var(--text); margin-bottom: 3px; }
			.oss-desc  { font-size: 0.83rem; color: var(--text-muted); }
		</style>
	</head>
	<body>

		<!-- ── Hero ── -->
		<section class="hero-section">
			<div class="container position-relative">
                <img src="img/favicon.ico">
				<h1 class="hero-title reveal reveal-delay-1">
					AI solutions, for everyone <br><span class="accent">and everything</span>
				</h1>
				<div class="hero-cta-group d-flex justify-content-center gap-3 mt-4 flex-wrap reveal reveal-delay-3">
					<a href="https://inferenceport.ai" class="btn btn-hero-download">Go to inferenceport.ai</a>
				</div>
			</div>
		</section>

		<ip-footer></ip-footer>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script>
		(function() {
			const toggleState = { search: false, img: false, vid: false, audio: false };
			let attachedImageB64 = null;
			let attachedImageType = null;
			let attachedImageName = null;

			window.lrToggle = function(key) {
				toggleState[key] = !toggleState[key];
				const btn = document.getElementById('tog-' + key);
				btn.classList.toggle('active', toggleState[key]);
			};

			window.lrImageAttached = function(input) {
				const file = input.files[0];
				if (!file) return;
				attachedImageName = file.name;
				attachedImageType = file.type || 'image/jpeg';
				const reader = new FileReader();
				reader.onload = function(e) {
					attachedImageB64 = e.target.result.split(',')[1];
					document.getElementById('lr-img-name').textContent = attachedImageName;
					document.getElementById('lr-img-preview').style.display = 'inline-flex';
					document.querySelector('.lr-upload-btn').classList.add('has-file');
					document.getElementById('lr-upload-label').textContent = 'Attached';
				};
				reader.readAsDataURL(file);
			};

			window.lrClearImage = function() {
				attachedImageB64 = null;
				attachedImageType = null;
				attachedImageName = null;
				document.getElementById('lr-img-preview').style.display = 'none';
				document.querySelector('.lr-upload-btn').classList.remove('has-file');
				document.getElementById('lr-upload-label').textContent = 'Image';
				document.getElementById('lr-img-upload').value = '';
			};

			window.lrAnalyze = async function() {
				const promptText = document.getElementById("lr-prompt").value.trim();
				if (!promptText && !attachedImageB64) return;

				const btn    = document.getElementById("lr-analyze-btn");
				const spin   = document.getElementById("lr-btn-spinner");
				const btnTxt = document.getElementById("lr-btn-text");
				const errEl  = document.getElementById("lr-error");
				const resEl  = document.getElementById("lr-result");

				btn.disabled = true;
				spin.style.display = "block";
				btnTxt.textContent = "Routing…";
				errEl.style.display = "none";
				resEl.style.display = "none";

				let msgContent;
				if (attachedImageB64) {
					msgContent = [
						{ type: "image_url", image_url: { url: `data:${attachedImageType};base64,${attachedImageB64}` } }
					];
					if (promptText) msgContent.push({ type: "text", text: promptText });
				} else {
					msgContent = promptText;
				}

				const tools = [];
				if (toggleState.search) tools.push({ type: "function", function: { name: "web_search", description: "Search the web" } });
				if (toggleState.img)    tools.push({ type: "function", function: { name: "image_generation", description: "Generate images" } });
				if (toggleState.vid)    tools.push({ type: "function", function: { name: "video_generation", description: "Generate video" } });
				if (toggleState.audio)  tools.push({ type: "function", function: { name: "audio_generation", description: "Generate audio" } });

				const payload = {
					prompt: [{ role: "user", content: msgContent }]
				};
				if (tools.length > 0) payload.tools = tools;

				try {
					const resp = await fetch("https://sharktide-lightning.hf.space/gen/prompt_analyze", {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify(payload)
					});
					if (!resp.ok) throw new Error(`${resp.status}`);
					const data = await resp.json();

					const modelName = data;
					const provider  = data.provider   || data.provider_name || "";

					document.getElementById("lr-result-icon").textContent     = "\u26A1";
					document.getElementById("lr-result-model").textContent    = modelName;
					document.getElementById("lr-result-provider").textContent = provider ? `via ${provider}` : "";
					resEl.style.display = "block";
				} catch(e) {
					errEl.textContent   = "Couldn't reach the routing API \u2014 please try again.";
					errEl.style.display = "block";
				} finally {
					btn.disabled = false;
					spin.style.display = "none";
					btnTxt.textContent = "\u26A1 Analyze";
				}
			};

			document.getElementById("lr-prompt").addEventListener("keydown", function(e) {
				if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); lrAnalyze(); }
			});
		})();
		</script>
	</body>
</html>
