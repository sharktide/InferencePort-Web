<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>InferencePort AI Marketplace</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles/shared.css" />
		<script src="components/ip-navbar.js"></script>
		<style>
			.hero-section {
				background: linear-gradient(180deg, rgba(79, 124, 255, 0.04) 0%, transparent 100%);
				padding: 72px 0;
			}

			#search-models {
				background: var(--surface);
				border: 1px solid var(--border);
				color: var(--text-body);
				border-radius: 9px;
				padding: 11px 16px;
				font-size: 0.9rem;
			}

			#search-models:focus {
				border-color: var(--brand-border);
				box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15);
				outline: none;
			}

			#search-models::placeholder {
				color: var(--muted);
			}

			.filter-tabs {
				display: flex;
				gap: 6px;
				flex-wrap: wrap;
				justify-content: center;
				margin-bottom: 1.5rem;
			}

			.filter-tab {
				background: var(--surface);
				border: 1px solid var(--border);
				color: var(--muted);
				padding: 7px 18px;
				border-radius: 999px;
				font-size: 0.82rem;
				font-weight: 600;
				cursor: pointer;
				transition: all 0.15s;
				text-transform: uppercase;
				letter-spacing: 0.03em;
			}

			.filter-tab:hover {
				border-color: var(--brand-border);
				color: var(--text);
			}

			.filter-tab.active {
				background: var(--brand-dim);
				border-color: var(--brand-border);
				color: var(--brand);
			}

			.models-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
				gap: 1rem;
			}

			.model-card {
				background: var(--surface);
				border: 1.5px solid var(--border);
				border-radius: 12px;
				padding: 1.1rem 1.25rem;
				display: grid;
				gap: 0.8rem;
				transition: border-color 0.15s, transform 0.15s;
			}

			.model-card:hover {
				border-color: var(--brand-border);
				transform: translateY(-2px);
				box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
			}

			.model-card-top {
				display: flex;
				justify-content: space-between;
				align-items: start;
				gap: 8px;
			}

			.model-card-name {
				font-size: 0.95rem;
				font-weight: 600;
				color: var(--text);
				letter-spacing: -0.01em;
			}

			.model-pill {
				font-size: 0.68rem;
				font-weight: 700;
				text-transform: uppercase;
				padding: 0.32rem 0.55rem;
				border-radius: 999px;
				border: 1px solid transparent;
				white-space: nowrap;
				flex-shrink: 0;
			}

			.pill-text {
				color: #0f766e;
				background: rgba(20, 184, 166, 0.12);
			}

			.pill-image {
				color: #b45309;
				background: rgba(245, 158, 11, 0.10);
			}

			.pill-video, .pill-audio {
				color: #7c3aed;
				background: rgba(124, 58, 237, 0.10);
			}

			.pill-3d {
				color: #1a6bff;
				background: rgba(26, 107, 255, 0.10);
			}

			.model-meta {
				display: flex;
				flex-direction: column;
				gap: 0.2rem;
			}

			.model-key {
				font-size: 0.68rem;
				font-weight: 700;
				text-transform: uppercase;
				color: var(--muted);
				letter-spacing: 0.04em;
			}

			.model-value {
				font-family: "JetBrains Mono", monospace;
				font-size: 0.74rem;
				color: var(--text);
			}

			.model-highlight {
				outline: 2px solid var(--brand);
				box-shadow: 0 0 0 5px rgba(79, 124, 255, 0.15);
			}

			.no-results {
				text-align: center;
				color: var(--muted);
				padding: 3rem 0;
				font-size: 0.95rem;
			}

			.section-count {
				text-align: center;
				color: var(--muted);
				font-size: 0.85rem;
				margin-bottom: 1.5rem;
			}
		</style>
	<script data-goatcounter="https://ipai.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

	<body>
		<ip-navbar active="marketplace"></ip-navbar>

		<section class="hero-section text-white text-center">
			<div class="container">
				<h1 class="display-4 fw-bold" style="letter-spacing: -1px">
					InferencePort AI Marketplace
				</h1>
				<p
					class="lead mt-3"
					style="color: var(--text-muted); max-width: 520px; margin: 12px auto 0;"
				>
					Browse all available AI models across text, image, video, and 3D.
				</p>
			</div>
		</section>

		<section class="py-5">
			<div class="container">
				<h2
					class="fw-bold text-center mb-4"
					style="color: var(--text); letter-spacing: -0.02em"
				>
					Available Models
				</h2>
				<div class="filter-tabs" id="filter-tabs">
					<button class="filter-tab active" data-filter="all">All</button>
					<button class="filter-tab" data-filter="text">Text</button>
					<button class="filter-tab" data-filter="image">Image</button>
					<button class="filter-tab" data-filter="video">Video</button>
					<button class="filter-tab" data-filter="audio">Audio</button>
					<button class="filter-tab" data-filter="3d">3D</button>
				</div>
				<input
					type="text"
					id="search-models"
					class="form-control mb-4"
					placeholder="Search models…"
				/>
				<div class="text-center my-4" id="loading-spinner">
					<div class="spinner-border" style="color: var(--brand)" role="status">
						<span class="visually-hidden">Loading…</span>
					</div>
				</div>
				<div class="section-count" id="model-count"></div>
				<div class="models-grid" id="available-models"></div>
				<div class="no-results" id="no-results" style="display: none;">No models found.</div>
			</div>
		</section>

		<ip-footer></ip-footer>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script src="components/ip-footer.js"></script>
		<script src="scripts/animations.js"></script>
		<script>
			const API_BASE = "https://sharktide-lightning.hf.space";
			let allModels = [];
			let config = null;
			let activeFilter = "all";

			function isTextModel(m) {
				const i = Array.isArray(m?.input_modalities) ? m.input_modalities : [];
				const o = Array.isArray(m?.output_modalities) ? m.output_modalities : [];
				return i.includes("text") && o.includes("text");
			}

			function slug(m) {
				return m?.id || m?.upstream_id || m?.openrouter?.slug || "";
			}

			function modelType(m) {
				if (m.type) return m.type;
				const i = Array.isArray(m?.input_modalities) ? m.input_modalities : [];
				const o = Array.isArray(m?.output_modalities) ? m.output_modalities : [];
				if (i.includes("text") && o.includes("text")) return "text";
				if (o.includes("image")) return "image";
				if (o.includes("video")) return "video";
				if (o.includes("audio")) return "audio";
				return "text";
			}

			function pillClass(type) {
				switch (type) {
					case "text": return "pill-text";
					case "image": return "pill-image";
					case "video": return "pill-video";
					case "audio": return "pill-audio";
					case "3D":
					case "3d": return "pill-3d";
					default: return "pill-text";
				}
			}

			function formatPricing(m) {
				const p = m?.pricing || {};
				if (p.prompt != null && p.completion != null) {
					const perMillion = (v) => (v * 1000000).toFixed(2);
					return `In: $${perMillion(p.prompt)}/M · Out: $${perMillion(p.completion)}/M`;
				}
				return null;
			}

			function formatModelPrice(m) {
				const p = m?.price;
				if (p == null) return null;
				const type = m.type;
				if (type === "video" || type === "audio") return `$${p}/sec`;
				if (type === "image") return `$${p}/gen`;
				if (type === "3D") return `$${p}/model`;
				return `$${p}`;
			}

			function formatPrice(m) {
				return formatModelPrice(m) || formatPricing(m) || "Pricing unavailable";
			}

			function modalities(m) {
				const arr = Array.isArray(m?.input_modalities) ? m.input_modalities : [];
				return arr.length ? arr.map((v) => v.toUpperCase()).join(" / ") : "Configured model";
			}

			async function loadModels() {
				const spinner = document.getElementById("loading-spinner");
				spinner.style.display = "block";
				try {
					const [configRes, modelsRes] = await Promise.all([
						fetch(`${API_BASE}/v1/config`),
						fetch(`${API_BASE}/v1/models`)
					]);

					const cfg = await configRes.json().catch(() => ({}));
					config = cfg;

					const modelsData = await modelsRes.json().catch(() => ({}));
					const remoteModels = Array.isArray(modelsData.data) ? modelsData.data : [];
					const configModels = Array.isArray(cfg.models) ? cfg.models : [];

					const textRemote = remoteModels.filter((m) => isTextModel(m) && m.is_ready !== false);
					const all = [...textRemote, ...configModels];

					const seen = new Set();
					allModels = all.filter((m) => {
						const k = slug(m) || m.name;
						if (!k || seen.has(k)) return false;
						seen.add(k);
						return true;
					});
				} catch (err) {
					console.error("Error loading models:", err);
					allModels = [];
				} finally {
					spinner.style.display = "none";
				}
			}

			function scrollToHashModel() {
				const hash = window.location.hash;
				if (!hash) return;
				const modelName = decodeURIComponent(hash.substring(1));
				const target = document.getElementById("model-" + encodeURIComponent(modelName));
				if (target) {
					setTimeout(() => {
						target.scrollIntoView({ behavior: "smooth", block: "center" });
						target.classList.add("model-highlight");
					}, 100);
				}
			}

			function renderModels(filter = "") {
				const container = document.getElementById("available-models");
				const countEl = document.getElementById("model-count");
				const noResults = document.getElementById("no-results");
				container.innerHTML = "";

				const filtered = allModels.filter((m) => {
					const matchesSearch = !filter || (m.name || "").toLowerCase().includes(filter.toLowerCase()) || (m.id || "").toLowerCase().includes(filter.toLowerCase());
					const type = modelType(m);
					const matchesType = activeFilter === "all" || type === activeFilter || (activeFilter === "3d" && type === "3D");
					return matchesSearch && matchesType;
				});

				if (filtered.length === 0) {
					noResults.style.display = "block";
					countEl.textContent = "";
				} else {
					noResults.style.display = "none";
					countEl.textContent = `${filtered.length} model${filtered.length !== 1 ? "s" : ""} available`;
				}

				filtered.forEach((m) => {
					const type = modelType(m);
					const displayName = m.name || m.id || "Unnamed model";
					const displaySlug = slug(m) || "—";
					const price = formatPrice(m);

					const card = document.createElement("div");
					card.className = "model-card";
					card.id = "model-" + encodeURIComponent(displayName);

					card.innerHTML = `
						<div class="model-card-top">
							<span class="model-card-name">${displayName}</span>
							<span class="model-pill ${pillClass(type)}">${(m.type || type).toUpperCase()}</span>
						</div>
						<div class="model-meta">
							<span class="model-key">Slug</span>
							<span class="model-value">${displaySlug}</span>
						</div>
						<div class="model-meta">
							<span class="model-key">Pricing</span>
							<span class="model-value">${price}</span>
						</div>
					`;

					container.appendChild(card);
				});
			}

			document.getElementById("search-models").addEventListener("input", (e) => {
				renderModels(e.target.value);
			});

			document.getElementById("filter-tabs").addEventListener("click", (e) => {
				const tab = e.target.closest(".filter-tab");
				if (!tab) return;
				document.querySelectorAll(".filter-tab").forEach((t) => t.classList.remove("active"));
				tab.classList.add("active");
				activeFilter = tab.dataset.filter;
				renderModels(document.getElementById("search-models").value);
			});

			document.addEventListener("DOMContentLoaded", async () => {
				await loadModels();
				renderModels();
				scrollToHashModel();
			});
		</script>
	</body>
</html>
