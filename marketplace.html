<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>InferencePort AI Marketplace</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles/shared.css" />
		<script src="components/ip-navbar.js"></script>
		<style>
			/* Hero */
			.hero-section {
				background: linear-gradient(180deg, rgba(79, 124, 255, 0.04) 0%, transparent 100%);
				padding: 72px 0;
			}

			/* Search */
			#search-models {
				background: var(--surface);
				border: 1px solid var(--border);
				color: var(--text-body);
				border-radius: 9px;
				padding: 11px 16px;
				font-size: 0.9rem;
			}

			#search-models:focus {
				border-color: var(--brand-border);
				box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15);
				outline: none;
			}

			#search-models::placeholder {
				color: var(--muted);
			}

			/* Model cards */
			.model-card {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 14px;
				padding: 24px;
				transition:
					transform 0.2s,
					border-color 0.2s,
					box-shadow 0.2s;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				height: 100%;
			}

			.model-card:hover {
				transform: translateY(-4px);
				border-color: var(--brand-border);
				box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
			}

			.model-highlight {
				outline: 2px solid var(--brand);
				box-shadow: 0 0 0 5px rgba(79, 124, 255, 0.15);
			}

			.model-name {
				font-size: 1.25rem;
				font-weight: 700;
				color: var(--text);
				margin-bottom: 8px;
				letter-spacing: -0.02em;
			}

			.model-description {
				font-size: 0.86rem;
				color: var(--text-muted);
				margin-bottom: 14px;
				line-height: 1.6;
				white-space: pre-wrap;
			}

			.size-badge {
				background: rgba(79, 124, 255, 0.12);
				color: var(--brand);
				border: 1px solid var(--brand-border);
				font-weight: 500;
				padding: 3px 10px;
				border-radius: 6px;
				font-size: 0.78rem;
				margin-right: 5px;
				margin-bottom: 4px;
				display: inline-block;
				font-family: "JetBrains Mono", monospace;
			}

			.meta-text {
				margin-top: 10px;
				font-size: 0.83rem;
				color: var(--muted);
			}

			.meta-text strong {
				color: var(--text);
			}

			.more-link {
				color: var(--brand);
				text-decoration: none;
				font-size: 0.83rem;
				font-weight: 500;
			}

			.more-link:hover {
				text-decoration: underline;
			}

			.download-btn {
				margin-top: 18px;
				background: var(--brand-dim);
				border: 1px solid var(--brand-border);
				color: var(--brand);
				padding: 10px;
				border-radius: 9px;
				font-weight: 500;
				font-size: 0.86rem;
				width: 100%;
				transition: background 0.18s;
				cursor: pointer;
			}

			.download-btn:hover {
				background: rgba(79, 124, 255, 0.15);
				color: var(--brand);
			}

			/* Modal */
			.modal-content {
				background: #ffffff;
				border: 1px solid var(--border);
				border-radius: 14px;
			}

			.modal-header {
				border-bottom: 1px solid var(--border);
				padding: 18px 22px;
			}

			.modal-title {
				color: var(--text);
				font-weight: 700;
			}

			.modal-body {
				padding: 22px;
				color: var(--text-body);
				font-size: 0.88rem;
				line-height: 1.7;
			}

			.modal-body strong {
				color: var(--text);
			}

			.btn-close {
			}

			.badge.bg-secondary {
				background: var(--bg-alt) !important;
				color: var(--text-body);
				font-weight: 400;
			}

			#modalDownloadBtn {
				background: var(--brand);
				border: none;
				color: #fff;
				border-radius: 7px;
				padding: 7px 18px;
				font-size: 0.84rem;
				font-weight: 600;
			}

			#modalDownloadBtn:hover {
				opacity: 0.85;
			}

			#modalModelLink {
				color: var(--brand);
				text-decoration: none;
				font-size: 0.84rem;
			}

			#modalModelLink:hover {
				text-decoration: underline;
			}

		</style>
	</head>

	<body>
		<ip-navbar active="marketplace"></ip-navbar>

		<!-- Hero -->
		<section class="hero-section text-white text-center">
			<div class="container">
				<h1 class="display-4 fw-bold" style="letter-spacing: -1px">
					InferencePort AI Marketplace
				</h1>
				<p
					class="lead mt-3"
					style="
						color: var(--text-muted);
						max-width: 520px;
						margin: 12px auto 0;
					"
				>
					Browse and download AI models for InferencePort directly
					from your browser.
				</p>
			</div>
		</section>

		<!-- Models -->
		<section class="py-5">
			<div class="container">
				<h2
					class="fw-bold text-center mb-4"
					style="color: var(--text); letter-spacing: -0.02em"
				>
					Available Models
				</h2>
				<input
					type="text"
					id="search-models"
					class="form-control mb-4"
					placeholder="Search models…"
				/>
				<div class="text-center my-4" id="loading-spinner">
					<div
						class="spinner-border"
						style="color: var(--brand)"
						role="status"
					>
						<span class="visually-hidden">Loading…</span>
					</div>
				</div>
				<div class="row g-4" id="available-models"></div>
			</div>
		</section>

		<!-- Modal -->
		<div class="modal fade" id="modelModal" tabindex="-1">
			<div class="modal-dialog modal-lg modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="modalModelName"></h5>
						<button
							type="button"
							class="btn btn-primary btn-download"
							id="modalDownloadBtn"
						>
							Download
						</button>
						<button
							type="button"
							class="btn-close ms-2"
							data-bs-dismiss="modal"
						></button>
					</div>
					<div class="modal-body">
						<p
							id="modalModelDesc"
							style="white-space: pre-wrap"
						></p>
						<div class="mb-2">
							<strong>Tags:</strong>
							<span id="modalModelTags"></span>
						</div>
						<div class="mb-2">
							<strong>Sizes:</strong>
							<span id="modalModelSizes"></span>
						</div>
						<div class="mb-2">
							<strong>Pulls:</strong>
							<span id="modalModelPulls"></span>
						</div>
						<div class="mb-2">
							<strong>Updated:</strong>
							<span id="modalModelUpdated"></span>
						</div>
						<a id="modalModelLink" target="_blank"></a>
					</div>
				</div>
			</div>
		</div>

		<ip-footer></ip-footer>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script src="components/ip-footer.js"></script>
		<script src="scripts/animations.js"></script>
		<script>
			let availableModels = [];

			async function fetchAvailableModels() {
				const spinner = document.getElementById("loading-spinner");
				spinner.style.display = "block";
				try {
					const res = await fetch(
						"https://sharktide-lightning.hf.space/models",
					);
					if (!res.ok) {
						console.error("Failed to fetch models:", res.status);
						return [];
					}
					return await res.json();
				} catch (err) {
					console.error("Error fetching models:", err);
					return [];
				} finally {
					spinner.style.display = "none";
				}
			}

			function cleanText(text) {
				return text.replace(/^\s+/gm, "").trim();
			}

			function scrollToHashModel() {
				const hash = window.location.hash;
				if (!hash) return;
				const modelName = decodeURIComponent(hash.substring(1));
				const target = document.getElementById(
					"model-" + encodeURIComponent(modelName),
				);
				if (target) {
					setTimeout(() => {
						target.scrollIntoView({
							behavior: "smooth",
							block: "center",
						});
						target.classList.add("model-highlight");
					}, 100);
				}
			}

			function renderAvailableModels(filter = "") {
				const container = document.getElementById("available-models");
				container.innerHTML = "";

				availableModels
					.filter((m) =>
						m.name.toLowerCase().includes(filter.toLowerCase()),
					)
					.forEach((model) => {
						const col = document.createElement("div");
						col.className = "col-lg-4 col-md-6";

						const card = document.createElement("div");
						card.className = "model-card";
						card.id = "model-" + encodeURIComponent(model.name);

						const top = document.createElement("div");

						const nameEl = document.createElement("div");
						nameEl.className = "model-name";
						nameEl.textContent = model.name;

						const descEl = document.createElement("div");
						descEl.className = "model-description";
						descEl.textContent = cleanText(model.description);

						const sizesWrapper = document.createElement("div");
						model.sizes.forEach((size) => {
							const badge = document.createElement("span");
							badge.className = "size-badge";
							badge.textContent = size;
							sizesWrapper.appendChild(badge);
						});

						const pullsEl = document.createElement("div");
						pullsEl.className = "meta-text";
						pullsEl.innerHTML = "<strong>Pulls:</strong> ";
						const pullsVal = document.createElement("span");
						pullsVal.textContent = model.pulls;
						pullsEl.appendChild(pullsVal);

						const updatedEl = document.createElement("div");
						updatedEl.className = "meta-text";
						updatedEl.innerHTML = "<strong>Updated:</strong> ";
						const updatedVal = document.createElement("span");
						updatedVal.textContent = model.updated;
						updatedEl.appendChild(updatedVal);

						const downloadBtn = document.createElement("button");
						downloadBtn.className = "download-btn";
						downloadBtn.textContent = "Get in App";
						downloadBtn.onclick = () => {
							window.location.href = `inferenceport-ai:///marketplace/ollama#${encodeURIComponent(model.name)}`;
						};

						top.appendChild(nameEl);
						top.appendChild(descEl);
						top.appendChild(sizesWrapper);
						top.appendChild(pullsEl);
						top.appendChild(updatedEl);

						if (model.link) {
							const linkWrapper = document.createElement("div");
							linkWrapper.className = "mt-2";
							const link = document.createElement("a");
							link.className = "more-link";
							link.target = "_blank";
							link.rel = "noopener noreferrer";
							link.href = `https://ollama.com${model.link}`;
							link.textContent = "More details";
							linkWrapper.appendChild(link);
							top.appendChild(linkWrapper);
						}

						card.appendChild(top);
						card.appendChild(downloadBtn);
						col.appendChild(card);
						container.appendChild(col);
					});
			}

			function openModelModal(model) {
				const bsModal = new bootstrap.Modal(
					document.getElementById("modelModal"),
				);
				document.getElementById("modalModelName").textContent =
					model.name;
				document.getElementById("modalModelDesc").textContent =
					model.description;
				document.getElementById("modalModelTags").innerHTML = model.tags
					.map(
						(t) =>
							`<span class="badge bg-secondary me-1">${t}</span>`,
					)
					.join(" ");
				document.getElementById("modalModelSizes").textContent =
					model.sizes.join(", ");
				document.getElementById("modalModelPulls").textContent =
					model.pulls;
				document.getElementById("modalModelUpdated").textContent =
					model.updated;
				const linkEl = document.getElementById("modalModelLink");
				if (model.link) {
					linkEl.href = `https://ollama.com${model.link}`;
					linkEl.textContent = "More details on Ollama.com";
				} else {
					linkEl.textContent = "";
				}
				document.getElementById("modalDownloadBtn").onclick = () => {
					window.location.href = `inferenceport-ai:///marketplace/ollama#${encodeURIComponent(model.name)}`;
				};
				bsModal.show();
			}

			document
				.getElementById("search-models")
				.addEventListener("input", (e) =>
					renderAvailableModels(e.target.value),
				);

			document.addEventListener("DOMContentLoaded", async () => {
				availableModels = await fetchAvailableModels();
				renderAvailableModels();
				scrollToHashModel();
			});
		</script>
	</body>
</html>
